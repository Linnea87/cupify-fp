# ==================================================
# Service
# ==================================================
org: ${file(./local.yml):org}
service: cupify-fp

# ==================================================
# Provider
# ==================================================
provider:
  name: aws
  runtime: nodejs22.x
  region: eu-north-1

  iam:
    role: ${file(./local.yml):role}

  environment:
    TOURNAMENTS_TABLE: ${self:service}-tournaments-${sls:stage}
    TEAMS_TABLE: ${self:service}-teams-${sls:stage}
    MATCHES_TABLE: ${self:service}-matches-${sls:stage}

functions:
  # ==================================================
  # Functions – Tournaments
  # ==================================================
  getTournaments:
    handler: functions/tournaments/getTournaments/index.handler
    events:
      - httpApi:
          path: /tournaments
          method: get

  getTournament:
    handler: functions/tournaments/getTournament/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}
          method: get

  createTournament:
    handler: functions/tournaments/createTournament/index.handler
    events:
      - httpApi:
          path: /tournaments
          method: post

  updateTournamentStatus:
    handler: functions/tournaments/updateTournamentStatus/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/status
          method: patch

  deleteTournament:
    handler: functions/tournaments/deleteTournament/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}
          method: delete

  # ==================================================
  # Functions – Teams
  # ==================================================
  getTeams:
    handler: functions/teams/getTeams/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/teams
          method: get

  getTeam:
    handler: functions/teams/getTeam/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/teams/{teamId}
          method: get

  createTeam:
    handler: functions/teams/createTeam/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/teams
          method: post

  updateTeam:
    handler: functions/teams/updateTeam/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/teams/{teamId}
          method: put

  deleteTeam:
    handler: functions/teams/deleteTeam/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/teams/{teamId}
          method: delete

  # ==================================================
  # Functions – Matches
  # ==================================================
  getMatches:
    handler: functions/matches/getMatches/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/matches
          method: get

  getMatch:
    handler: functions/matches/getMatch/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/matches/{matchId}
          method: get

  createMatch:
    handler: functions/matches/createMatch/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/matches
          method: post

  updateMatch:
    handler: functions/matches/updateMatch/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/matches/{matchId}
          method: put

  reportMatchResult:
    handler: functions/matches/reportMatchResult/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/matches/{matchId}/result
          method: patch

  deleteMatch:
    handler: functions/matches/deleteMatch/index.handler
    events:
      - httpApi:
          path: /tournaments/{id}/matches/{matchId}
          method: delete

# ==================================================
# Resources – DynamoDB tables
# ==================================================
resources:
  Resources:
    TournamentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TOURNAMENTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH

    TeamsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TEAMS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tournamentId
            AttributeType: S
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: tournamentId
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE

    MatchesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.MATCHES_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tournamentId
            AttributeType: S
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: tournamentId
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE